name: Workflow ASCII Art

on:
  workflow_dispatch:

jobs:
  ascii_workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Generate ASCII
        run: bash .github/workflows/ascii.sh

      - name: Display Dragon File
        run: cat dragon.txt

      - name: Upload Dragon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-file
          path: dragon.txt

  test_job_2:
    needs: ascii_workflow
    runs-on: ubuntu-latest

    steps:
      - name: Download Dragon Artifact
        uses: actions/download-artifact@v4
        with:
          name: dragon-file

      - name: Sleep for seconds
        run: sleep 10

      - name: Test File Exists
        run: |
          ls -ltra
          test -f dragon.txt

      - name: Test Dragon Content
        run: grep -i "dragon" dragon.txt

  deploy_job_3:
    needs: test_job_2
    runs-on: ubuntu-latest

    steps:
      - name: Download Dragon Artifact
        uses: actions/download-artifact@v4
        with:
          name: dragon-file

      - name: Read the File
        run: cat dragon.txt

      - name: Deploy
        run: echo "Deploying....."