name: Matrix Configuration

on:
  push:

jobs:
  deploy:
    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        os: [ubuntu-latest, ubuntu-20.04, windows-latest]
        images: [hello-world, alpine]

        include:
          - os: ubuntu-20.04
            images: amd64/alpine

        exclude:
          - os: windows-latest
            images: alpine

    runs-on: ${{ matrix.os }}

    steps:
      - name: Echo Docker Details
        run: docker info

      - name: Run Docker Image
        run: docker run ${{ matrix.images }}